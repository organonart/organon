# organon-console — Organon Console's own code (Console #3 T1).
#
# ⚠️ NO nih_plug. Enforced: `cargo tree -p organon-console | grep nih_plug` must be
# empty — the organon-mind rule (#536 T5), applied for a harder reason here: the Console
# is standalone-only PERMANENTLY (PRD v2 FR-46). `nih_export_vst3!`/`nih_export_clap!`
# are not edition-gated, so any nih_plug in this graph is a loaded gun pointed at
# Organon's own class ID. The only safe amount is none — which also means building
# this package never compiles the plugin host stack at all (`-p organon-console` is the
# tight loop).
#
# The crate is the LIB ONLY — the compositor UI, Edition-parametric so it is
# unit-tested from a default feature-off build (the mind_ui precedent). The product
# BINARY lives in the root crate (`native/src/console_main.rs`), exactly like
# `organon-mind`'s: the window must own the wgpu device that will render `World`
# (Console #6), and `world` lives in the root crate until #618 extracts it — a
# bin in THIS package could only reach it by depending on the root lib, which would
# pull nih_plug into this package's tree and break the acceptance test above.
#
# This package crosses into the public repo: `scripts/mirror-platform.manifest` names
# it with an INCLUDE, byte-identical like every other member. Its PRD and build plan do
# not — `EXCLUDE doc` keeps those private, so a public reader sees what the Console is
# and what exists today, but not the tactical sequencing.
[package]
name = "organon-console"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Organon Console: the agent-operating workstation's compositor and front-of-house."
repository = "https://github.com/organonart/organon"

[features]
# Forwards to organon-core, where `EDITION` lives — one switch, one resolution site
# (the root crate's `console-edition` forwards through here too, mind-symmetric). OFF
# by default; this lib builds and tests without it because every UI decision takes
# `Edition` as a value.
console-edition = ["organon-core/console-edition"]

# FIVE dependencies, each because a `use` in src/ needs it (the organon-mind rule:
# an unused dep is silent by default, so every edge here must earn its line). The
# window stack (winit/wgpu/egui-winit/the vendored egui-wgpu) still belongs to the
# root-crate binary that owns the window.
#   organon-core — the Edition value every UI decision is a function of.
#   egui         — the compositor UI itself.
#   serde/serde_json — the #4 session/event schema IS serde types + a JSONL log;
#                  the schema is the product's shared vocabulary, not a sidecar.
#   dirs         — the one store-path resolver (the #658 lesson, recorded in
#                  organon-mind/Cargo.toml: a hand-rolled `$HOME` put the store in
#                  `%TEMP%` on Windows). Never resolve the store any other way.
# All four additions are workspace-wide deps already — nothing new downloads.
[dependencies]
organon-core = { path = "../organon-core" }
egui = "0.33.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
portable-pty = "0.9.0"
alacritty_terminal = "0.26.0"
